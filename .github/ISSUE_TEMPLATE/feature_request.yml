name: Feature request
description: Suggest an idea for this project
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for product or developer-experience improvements.
        If you are reporting a bug, please use the bug report form instead.

  - type: dropdown
    attributes:
      label: Affected area
      description: Which area would this feature improve?
      options:
        - Backend API
        - Web frontend
        - Installer
        - Desktop time tracker
        - Authentication / sessions
        - Storage / uploads
        - Notifications / chat
        - Timesheet / tracker
        - Project / task management
        - Documentation / onboarding
        - Other
    validations:
      required: true

  - type: textarea
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: >
        Describe the current pain point, workflow gap, or limitation.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed improvement
      description: Describe the feature, behavior, or change you want to see.
    validations:
      required: true

  - type: textarea
    attributes:
      label: User impact
      description: Who benefits from this and how does it improve their workflow?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: What workarounds or alternative approaches have you considered?
    validations:
      required: false

  - type: textarea
    attributes:
      label: Additional context
      description: Add screenshots, examples, references, or related issues if relevant.
    validations:
      required: false
