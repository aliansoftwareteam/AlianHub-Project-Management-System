name: Docs

# Builds the documentation site (docs-site/, VitePress) and publishes it to
# GitHub Pages at https://docs.alianhub.com. Pull requests only build it, so a
# dead link fails the check before merge.
#
# One-time repo setup: Settings → Pages → Source: GitHub Actions, custom domain
# docs.alianhub.com, Enforce HTTPS. DNS: CNAME docs → aliansoftwareteam.github.io.

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/API.md'
      - 'docs/api/openapi.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - 'docs/API.md'
      - 'docs/api/openapi.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lastUpdated dates on each page come from git history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
        working-directory: docs-site

      - run: npm run docs:build
        working-directory: docs-site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
