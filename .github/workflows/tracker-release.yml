name: Tracker release

# Builds the desktop tracker (time-tracker-app/) for Windows, macOS and Linux on a tracker-v* tag,
# signs it, and uploads it to the update feed the trackers and the web app read:
#   tracker-v6.1.0         -> https://downloads.alianhub.com/tracker/stable/
#   tracker-v6.1.0-beta.2  -> https://downloads.alianhub.com/tracker/beta/
# The tag must equal the version in time-tracker-app/package.json.
#
# Secrets. All optional: without a system's signing secrets it builds unsigned, beta and stable alike:
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD                      Windows code-signing certificate (.pfx, base64) and password
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD                      Developer ID Application certificate (.p12, base64) and password
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID    notarisation with notarytool
#   TRACKER_GPG_PRIVATE_KEY, TRACKER_GPG_PASSPHRASE         signs the Linux SHA256SUMS
#   DO_HOST, DO_USER, DO_SSH_KEY                            the control-plane VPS that serves downloads.alianhub.com
#                                                           (shared with main.yml); without them the files stay on the run

on:
  push:
    tags:
      - 'tracker-v*'

permissions:
  contents: read

concurrency:
  group: tracker-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Match the tag to the tracker version
        id: tag
        run: |
          version="${GITHUB_REF_NAME#tracker-v}"
          package_version="$(node -p "require('./time-tracker-app/package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match time-tracker-app/package.json version $package_version."
            exit 1
          fi
          case "$version" in
            *-*) channel=beta ;;
            *) channel=stable ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    defaults:
      run:
        shell: bash
        working-directory: time-tracker-app
    env:
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      FEED_URL: https://downloads.alianhub.com/tracker/${{ needs.prepare.outputs.channel }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: time-tracker-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check signing
        id: signing
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GPG_KEY: ${{ secrets.TRACKER_GPG_PRIVATE_KEY }}
        run: |
          case "${{ matrix.platform }}" in
            win) [ -n "$WIN_CSC_LINK" ] && signed=true || signed=false ;;
            mac) [ -n "$MAC_CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && signed=true || signed=false ;;
            linux) [ -n "$GPG_KEY" ] && signed=true || signed=false ;;
          esac
          # Signing is optional until the certificates exist: without a system's secrets it builds
          # unsigned on every channel, stable included (Windows SmartScreen warns, macOS Gatekeeper
          # needs right-click → Open, and macOS cannot auto-update an unsigned app).
          [ "$signed" = true ] || echo "::warning::Building ${{ matrix.platform }} unsigned for the $CHANNEL channel: no signing secrets."
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Build the renderer and main process
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npx nextron build --no-pack

      - name: Package for Windows
        if: matrix.platform == 'win'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed }}
        # electron-builder resolves an empty (but defined) CSC_LINK as a local file path and fails
        # ("... not a file") instead of treating it as absent, so an unsigned build must unset it.
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK; fi
          if [ -z "$CSC_KEY_PASSWORD" ]; then unset CSC_KEY_PASSWORD; fi
          npx electron-builder --win --x64 --publish never -c.publish.url="$FEED_URL"

      - name: Package for macOS
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.signed }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then unset CSC_LINK; fi
          if [ -z "$CSC_KEY_PASSWORD" ]; then unset CSC_KEY_PASSWORD; fi
          if [ "${{ steps.signing.outputs.signed }}" = true ]; then
            notarize="-c.mac.notarize.teamId=$APPLE_TEAM_ID"
          else
            notarize="-c.mac.notarize=false"
          fi
          npx electron-builder --mac --publish never -c.publish.url="$FEED_URL" $notarize

      - name: Package for Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --x64 --publish never -c.publish.url="$FEED_URL"

      - name: Sign the Linux checksums
        if: matrix.platform == 'linux'
        env:
          GPG_KEY: ${{ secrets.TRACKER_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.TRACKER_GPG_PASSPHRASE }}
        working-directory: time-tracker-app/dist
        run: |
          sha256sum *.AppImage *.deb > SHA256SUMS
          if [ "${{ steps.signing.outputs.signed }}" = true ]; then
            echo "$GPG_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
          fi

      - name: Keep the files on the run
        uses: actions/upload-artifact@v4
        with:
          name: tracker-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}
          path: |
            time-tracker-app/dist/*.exe
            time-tracker-app/dist/*.blockmap
            time-tracker-app/dist/*.dmg
            time-tracker-app/dist/*.zip
            time-tracker-app/dist/*.AppImage
            time-tracker-app/dist/*.deb
            time-tracker-app/dist/latest*.yml
            time-tracker-app/dist/SHA256SUMS*
          if-no-files-found: error

  # One job uploads every platform: installers first, then the latest*.yml manifests, so no tracker
  # ever reads a manifest that names a file not uploaded yet; then it prunes the channel once.
  # The feed is a folder on the control-plane VPS (DO_HOST), served as
  # https://downloads.alianhub.com/tracker/ by its web server, which must send latest*.yml with
  # Cache-Control: no-cache. A platform whose build failed keeps its previous release in the feed.
  publish:
    name: Publish to the update feed
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.DO_HOST }}
      SSH_USER: ${{ secrets.DO_USER }}
      SSH_KEY: ${{ secrets.DO_SSH_KEY }}
      FEED_DIR: /var/www/downloads/tracker/${{ needs.prepare.outputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
      KEEP_VERSIONS: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Collect the built files
        uses: actions/download-artifact@v4
        with:
          pattern: tracker-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: feed

      - name: Upload and keep the newest ${{ env.KEEP_VERSIONS }} versions
        working-directory: feed
        run: |
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::No downloads server configured (DO_HOST, DO_USER, DO_SSH_KEY); the files are kept on this run only."
            exit 0
          fi
          key="$RUNNER_TEMP/feed_key"
          install -m 600 /dev/null "$key"
          printf '%s\n' "$SSH_KEY" >"$key"
          trap 'rm -f "$key"' EXIT
          # Trusts the server's host key on first connect, as the staging deploy (main.yml) does.
          opts=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts")
          target="$SSH_USER@$SSH_HOST"
          shopt -s nullglob
          installers=(*.exe *.blockmap *.dmg *.zip *.AppImage *.deb SHA256SUMS*)
          manifests=(latest*.yml)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::error::No platform built; nothing to publish."
            exit 1
          fi
          ssh "${opts[@]}" "$target" "mkdir -p '$FEED_DIR'"
          scp "${opts[@]}" "${installers[@]}" "$target:$FEED_DIR/"
          scp "${opts[@]}" "${manifests[@]}" "$target:$FEED_DIR/"
          ssh "${opts[@]}" "$target" bash -s -- "$FEED_DIR" "$VERSION" "$KEEP_VERSIONS"             <"$GITHUB_WORKSPACE/.github/scripts/tracker-feed-prune.sh"
