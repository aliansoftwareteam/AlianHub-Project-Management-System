name: CI / Deploy

on:
  # Run only when changes land on `staging` — i.e. when a PR is merged.
  push:
    branches:
      - staging

  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------
      # Checkout
      # ---------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------
      # Node Setup
      # ---------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---------------------------------
      # Frontend Build
      # ---------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # ── Firebase (required) ───────────────────────────────────────
          # These get inlined into the bundle by Vue CLI at build time.
          # Missing values silently become `undefined` in the shipped JS,
          # which is why we map them explicitly here instead of relying
          # on a `.env` file (which is gitignored and not present on the
          # CI runner). Set each one in GitHub → Settings → Secrets and
          # variables → Actions → Repository secrets.
          VUE_APP_ENVIRONMENT:       ${{ secrets.VUE_APP_ENVIRONMENT }}
          VUE_APP_APIKEY:            ${{ secrets.VUE_APP_APIKEY }}
          VUE_APP_AUTHDOMAIN:        ${{ secrets.VUE_APP_AUTHDOMAIN }}
          VUE_APP_PROJECTID:         ${{ secrets.VUE_APP_PROJECTID }}
          VUE_APP_STORAGEBUCKET:     ${{ secrets.VUE_APP_STORAGEBUCKET }}
          VUE_APP_MESSAGINGSENDERID: ${{ secrets.VUE_APP_MESSAGINGSENDERID }}
          VUE_APP_APPID:             ${{ secrets.VUE_APP_APPID }}
          VUE_APP_MEASUREMENTID:     ${{ secrets.VUE_APP_MEASUREMENTID }}
          # ── App configuration ────────────────────────────────────────
          VUE_APP_STORAGE_TYPE:      ${{ secrets.VUE_APP_STORAGE_TYPE }}
          VUE_APP_AFFILIATEON:       ${{ secrets.VUE_APP_AFFILIATEON }}
          # ── OAuth / social login ─────────────────────────────────────
          # Client ids + enable flags are inlined into the bundle here, so
          # they must come from GitHub secrets — the server-side frontend/.env
          # is NOT used (the bundle is built on this runner, not the VPS).
          # Set these in GitHub → Settings → Secrets and variables → Actions.
          # Base URLs are constant for github.com / gitlab.com SaaS.
          VUE_APP_IS_GOOGLE_LOGIN:       ${{ secrets.VUE_APP_IS_GOOGLE_LOGIN }}
          VUE_APP_GOOGLE_CLIENT_ID:      ${{ secrets.VUE_APP_GOOGLE_CLIENT_ID }}
          VUE_APP_IS_GITHUB_LOGIN:       ${{ secrets.VUE_APP_IS_GITHUB_LOGIN }}
          VUE_APP_GITHUB_CLIENT_ID:      ${{ secrets.VUE_APP_GITHUB_CLIENT_ID }}
          VUE_APP_GITHUB_BASE_OAUTH_URL: "https://github.com/login/oauth"
          VUE_APP_IS_GITLAB_LOGIN:       ${{ secrets.VUE_APP_IS_GITLAB_LOGIN }}
          VUE_APP_GITLAB_CLIENT_ID:      ${{ secrets.VUE_APP_GITLAB_CLIENT_ID }}
          VUE_APP_GITLAB_BASE_OAUTH_URL: "https://gitlab.com/oauth"

      # ---------------------------------
      # Create Frontend Artifact
      # ---------------------------------

      - name: Archive frontend build
        run: |
          tar -czf frontend-dist.tar.gz -C frontend dist

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          retention-days: 1

  deploy:
    needs: validate
    # Deploy on a push to staging (PR merge) or a manual re-run from the
    # Actions tab (workflow_dispatch) — the latter lets us rebuild + redeploy
    # after a server-side env change without an empty commit.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------
      # Checkout
      # ---------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------
      # Download Frontend Artifact
      # ---------------------------------

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      # ---------------------------------
      # Upload Artifact to VPS
      # ---------------------------------

      - name: Upload frontend archive to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: frontend-dist.tar.gz
          target: /tmp

      # ---------------------------------
      # Deploy Application
      # ---------------------------------

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -e

            echo "🔧 Loading NVM..."

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            nvm use 22

            echo "🚀 Starting deployment..."

            cd /node/ALIAN/staging/

            # ---------------------------------
            # Update Backend Source
            # ---------------------------------

            echo "📥 Updating backend source"

            git fetch origin staging

            # ---------------------------------
            # Decide whether backend dependencies need reinstalling
            # ---------------------------------
            # Run `npm ci` only when one of these is true; otherwise skip it
            # and avoid the RAM spike:
            #   1. node_modules is missing      (first deploy / wiped)
            #   2. package-lock.json changed    (dependencies changed)
            #   3. Node major changed since the last install (e.g. 22 <-> 20.x)
            #      — native addons like bcrypt/sharp are built per Node ABI, so
            #      a version switch must rebuild them or the app crashes on boot.
            #
            # The lockfile check runs BEFORE `git reset --hard`, while HEAD
            # still points at the currently-deployed commit.

            NODE_MAJOR="$(node -v | cut -d. -f1 | tr -d 'v')"   # e.g. 22 or 20
            NODE_MARKER="node_modules/.node-major"
            BUILT_MAJOR="$(cat "$NODE_MARKER" 2>/dev/null || echo '')"

            NEED_INSTALL=0
            INSTALL_REASON=""

            if [ ! -d node_modules ]; then
              NEED_INSTALL=1
              INSTALL_REASON="node_modules missing (first deploy)"
            elif ! git diff --quiet HEAD origin/staging -- package-lock.json; then
              NEED_INSTALL=1
              INSTALL_REASON="dependencies changed"
            elif [ "$BUILT_MAJOR" != "$NODE_MAJOR" ]; then
              NEED_INSTALL=1
              INSTALL_REASON="Node version changed (built on ${BUILT_MAJOR:-unknown}, now $NODE_MAJOR)"
            fi

            git reset --hard origin/staging

            # ---------------------------------
            # Install Backend Dependencies (only when needed)
            # ---------------------------------

            if [ "$NEED_INSTALL" = "1" ]; then
              echo "📦 Installing backend dependencies — reason: $INSTALL_REASON"

              # Cap native-module build parallelism to keep peak RAM low:
              # JOBS=1 makes node-gyp/make compile addons (e.g. bcrypt) one
              # job at a time instead of one per CPU core. It only bites when a
              # module has no prebuilt binary and falls back to a source build.
              # --no-audit / --no-fund drop the post-install network audit and
              # funding scan (the security audit already runs in the CI job).
              JOBS=1 npm ci --omit=dev --no-audit --no-fund

              # Record the Node major these modules were built against, so the
              # next deploy can detect a version switch and rebuild them.
              echo "$NODE_MAJOR" > "$NODE_MARKER"
            else
              echo "📦 No dependency or Node-version change — skipping npm ci"
            fi

            # ---------------------------------
            # Frontend Backup + Deploy
            # ---------------------------------

            echo "🎨 Deploying frontend build"

            BACKUP_DIR="frontend/dist-backups"
            CURRENT_DIST="frontend/dist"

            mkdir -p $BACKUP_DIR

            # Backup existing dist
            if [ -d "$CURRENT_DIST" ]; then
              TIMESTAMP=$(date +"%Y%m%d-%H%M%S")

              echo "📦 Creating frontend backup: $TIMESTAMP"

              mv $CURRENT_DIST "$BACKUP_DIR/dist-$TIMESTAMP"
            fi

            # Create fresh dist directory
            mkdir -p frontend/dist

            # Extract uploaded artifact
            tar -xzf /tmp/frontend-dist.tar.gz -C frontend

            # ---------------------------------
            # Cleanup Old Backups
            # Keep only latest 5
            # ---------------------------------

            echo "🧹 Cleaning old backups"

            cd $BACKUP_DIR

            ls -dt dist-* 2>/dev/null | tail -n +6 | xargs -r rm -rf

            cd - > /dev/null

            # ---------------------------------
            # Restart Application
            # ---------------------------------

            echo "♻️ Restarting PM2"

            pm2 restart 18

            # ---------------------------------
            # Post-restart health check + diagnostics
            # ---------------------------------
            # Give the app a moment to boot, then probe it directly. A deploy
            # that leaves the process crash-looping previously reported
            # success (staging 502, 2026-06-10) — surface the truth in the
            # run log instead. Never fail the deploy step itself: the log
            # tail is the diagnostic.

            sleep 8

            echo "📊 PM2 Status"

            pm2 status

            if curl -sf -o /dev/null --max-time 5 http://127.0.0.1:4003/; then
              echo "✅ App is responding on 4003"
            else
              echo "❌ App NOT responding on 4003 — recent logs follow"
            fi

            echo "🩺 Recent app logs (stdout + stderr)"

            pm2 logs 18 --lines 60 --nostream || true

            echo "✅ Deployment completed"